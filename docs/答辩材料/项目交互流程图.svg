<polygon points="1260,574 1248.4690660038693,580.0031292820393 1248.4690660038693,567.9968707179607" fill="#16877E"/>
<polyline points="1550,574 1670,574" fill="none" stroke="#2864B4" stroke-width="3"/>
<polygon points="1670,574 1658.4690660038693,580.0031292820393 1658.4690660038693,567.9968707179607" fill="#2864B4"/>
<text x="1610" y="540" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#2864B4" text-anchor="middle" dominant-baseline="central">Wi-Fi</text>
<text x="270" y="812" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="400" fill="#62758A" text-anchor="middle" dominant-baseline="central">例如：</text>
<text x="270" y="867" font-family="Microsoft YaHei, sans-serif" font-size="31" font-weight="700" fill="#172B43" text-anchor="middle" dominant-baseline="central">“我今天有点累。”</text>
<text x="270" y="956" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#62758A" text-anchor="middle" dominant-baseline="central">声音由机器人采集</text>
<rect x="905" y="830" width="290" height="104" rx="18" fill="#DFEFEB" stroke="none" stroke-width="2"/>
