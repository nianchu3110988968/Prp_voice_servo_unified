<text x="1050" y="902" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#62758A" text-anchor="middle" dominant-baseline="central">决定“怎么回答”</text>
<rect x="1260" y="830" width="290" height="104" rx="18" fill="#DFEFEB" stroke="none" stroke-width="2"/>
<text x="1405" y="864" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#16877E" text-anchor="middle" dominant-baseline="central">音色配置</text>
<text x="1405" y="902" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#62758A" text-anchor="middle" dominant-baseline="central">决定“用什么声音”</text>
<text x="1050" y="976" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#16877E" text-anchor="middle" dominant-baseline="central">人格与音色可独立配置</text>
<polyline points="1050,700 1050,760 1610,760 1610,875 1670,875" fill="none" stroke="#B47A20" stroke-width="3" stroke-dasharray="10 8"/>
<polygon points="1670,875 1658.4690660038693,881.0031292820393 1658.4690660038693,868.9968707179607" fill="#B47A20"/>
<text x="1320" y="731" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#B47A20" text-anchor="middle" dominant-baseline="central">同时选择动作，随回复返回</text>
<polyline points="2180,700 2180,800" fill="none" stroke="#B47A20" stroke-width="3" stroke-dasharray="10 8"/>
<polygon points="2180,800 2173.9968707179605,788.4690660038693 2186.0031292820395,788.4690660038693" fill="#B47A20"/>
<text x="2080" y="751" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#B47A20" text-anchor="middle" dominant-baseline="central">起播时触发</text>
<rect x="1670" y="800" width="620" height="155" rx="20" fill="#FFFAF0" stroke="#D8B978" stroke-width="2" stroke-dasharray="10 7"/>
<text x="1980" y="843" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#B47A20" text-anchor="middle" dominant-baseline="central">⑥ 配合肢体动作</text>
<text x="1980" y="895" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#62758A" text-anchor="middle" dominant-baseline="central">ESP32 → 舵机驱动板 → 四肢 / 尾部</text>
<text x="1980" y="983" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#B47A20" text-anchor="middle" dominant-baseline="central">虚线：动作联动软件已实现，整机待验证</text>
<rect x="70" y="1080" width="2260" height="112" rx="24" fill="#172B43" stroke="none" stroke-width="2"/>
<text x="1200" y="1136" font-family="Microsoft YaHei, sans-serif" font-size="37" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">机器人负责“听、说、动”，电脑负责“识别、生成回复、合成声音”。</text>
<text x="90" y="1255" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#62758A" text-anchor="start" dominant-baseline="central">说明：展示普通对话的核心链路；动作经过开关、允许列表与忙碌状态检查，符合条件才执行。</text>
