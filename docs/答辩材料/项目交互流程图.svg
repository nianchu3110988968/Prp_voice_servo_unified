<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350"><rect width="2400" height="1350" fill="white"/>
<text x="90" y="92" font-family="Microsoft YaHei, sans-serif" font-size="60" font-weight="700" fill="#172B43" text-anchor="start" dominant-baseline="central">一句话，如何变成机器人的回应？</text>
<text x="94" y="172" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="400" fill="#62758A" text-anchor="start" dominant-baseline="central">毛绒陪伴机器人  /  普通对话主流程</text>
<rect x="1920" y="80" width="390" height="65" rx="30" fill="#EDF4FC" stroke="none" stroke-width="2"/>
<text x="2115" y="112" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#2864B4" text-anchor="middle" dominant-baseline="central">语音输入 → 语音与动作输出</text>
<rect x="70" y="270" width="400" height="750" rx="30" fill="#F1F6FC" stroke="none" stroke-width="2"/>
<rect x="510" y="270" width="1080" height="750" rx="30" fill="#F0F8F6" stroke="none" stroke-width="2"/>
<rect x="1630" y="270" width="700" height="750" rx="30" fill="#F1F6FC" stroke="none" stroke-width="2"/>
<text x="270" y="324" font-family="Microsoft YaHei, sans-serif" font-size="35" font-weight="700" fill="#2864B4" text-anchor="middle" dominant-baseline="central">机器人端 · 听</text>
<text x="1050" y="324" font-family="Microsoft YaHei, sans-serif" font-size="35" font-weight="700" fill="#16877E" text-anchor="middle" dominant-baseline="central">电脑端 · 理解与生成</text>
<text x="1980" y="324" font-family="Microsoft YaHei, sans-serif" font-size="35" font-weight="700" fill="#2864B4" text-anchor="middle" dominant-baseline="central">机器人端 · 说与动</text>
<text x="270" y="381" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#62758A" text-anchor="middle" dominant-baseline="central">ESP32-S3 + 麦克风</text>
<text x="1050" y="381" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#62758A" text-anchor="middle" dominant-baseline="central">AI bridge 协调三个处理模块</text>
<text x="1980" y="381" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#62758A" text-anchor="middle" dominant-baseline="central">ESP32-S3 + 扬声器 / 舵机</text>
<rect x="100" y="450" width="340" height="250" rx="20" fill="#FFFFFF" stroke="#D7E2ED" stroke-width="2"/>
<rect x="122" y="474" width="48" height="44" rx="12" fill="#2864B4" stroke="none" stroke-width="2"/>
<text x="146" y="496" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">1</text>
<text x="270.0" y="555" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#172B43" text-anchor="middle" dominant-baseline="central">唤醒并说话</text>
<text x="270.0" y="615" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#62758A" text-anchor="middle" dominant-baseline="central">麦克风采集语音</text>
<text x="270.0" y="657" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#62758A" text-anchor="middle" dominant-baseline="central">检测说话结束，上传录音</text>
<rect x="550" y="450" width="290" height="250" rx="20" fill="#FFFFFF" stroke="#D7E2ED" stroke-width="2"/>
<rect x="572" y="474" width="48" height="44" rx="12" fill="#16877E" stroke="none" stroke-width="2"/>
<text x="596" y="496" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">2</text>
<text x="695.0" y="555" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#172B43" text-anchor="middle" dominant-baseline="central">语音识别</text>
<text x="695.0" y="615" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#62758A" text-anchor="middle" dominant-baseline="central">声音 → 文字</text>
<text x="695.0" y="657" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#62758A" text-anchor="middle" dominant-baseline="central">ASR / Whisper</text>
<rect x="905" y="450" width="290" height="250" rx="20" fill="#FFFFFF" stroke="#D7E2ED" stroke-width="2"/>
<rect x="927" y="474" width="48" height="44" rx="12" fill="#16877E" stroke="none" stroke-width="2"/>
<text x="951" y="496" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">3</text>
<text x="1050.0" y="555" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#172B43" text-anchor="middle" dominant-baseline="central">生成回复</text>
<text x="1050.0" y="615" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#62758A" text-anchor="middle" dominant-baseline="central">理解内容，生成回答</text>
<text x="1050.0" y="657" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#62758A" text-anchor="middle" dominant-baseline="central">LLM / Ollama</text>
<rect x="1260" y="450" width="290" height="250" rx="20" fill="#FFFFFF" stroke="#D7E2ED" stroke-width="2"/>
<rect x="1282" y="474" width="48" height="44" rx="12" fill="#16877E" stroke="none" stroke-width="2"/>
<text x="1306" y="496" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">4</text>
<text x="1405.0" y="555" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#172B43" text-anchor="middle" dominant-baseline="central">语音合成</text>
<text x="1405.0" y="615" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#62758A" text-anchor="middle" dominant-baseline="central">回复文字 → 声音</text>
<text x="1405.0" y="657" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#62758A" text-anchor="middle" dominant-baseline="central">TTS / GPT-SoVITS</text>
<rect x="1670" y="450" width="620" height="250" rx="20" fill="#FFFFFF" stroke="#D7E2ED" stroke-width="2"/>
<rect x="1692" y="474" width="48" height="44" rx="12" fill="#2864B4" stroke="none" stroke-width="2"/>
<text x="1716" y="496" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">5</text>
<text x="1980.0" y="555" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#172B43" text-anchor="middle" dominant-baseline="central">下载并播放回复</text>
<text x="1980.0" y="615" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#62758A" text-anchor="middle" dominant-baseline="central">下载、校验音频，准备播放</text>
<text x="1980.0" y="657" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#62758A" text-anchor="middle" dominant-baseline="central">扬声器发出角色声音</text>
