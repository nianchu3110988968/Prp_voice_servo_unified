<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><style>text{font-family:'Microsoft YaHei UI','Microsoft YaHei',sans-serif;fill:#233c3b}.small{font-size:16px;fill:#687b78}.body{font-size:20px}.title{font-size:27px;font-weight:700}</style><rect width="1200" height="850" fill="#f3f5f1"/><rect width="1200" height="54" fill="#f7ead0"/><text x="34" y="35" font-size="18">视觉原型 · 所有数据仅作排版示例，非运行截图 / 非设备回执</text><text x="42" y="109" font-size="32" font-weight="700">PRP 陪伴台</text><text x="43" y="144" class="small">听见你的话，陪伴每一天</text><rect x="951" y="84" width="196" height="47" rx="12" fill="#fff"/><text x="995" y="115" class="body">连接与诊断</text><rect x="34" y="177" width="1132" height="125" rx="18" fill="#e1ece5"/><circle cx="74" cy="219" r="7" fill="#ad8547"/><text x="95" y="226" class="title">设备尚未连接</text><text x="57" y="267" class="small">先连接现有电脑服务，再选择设备串口。占用时请由原控制台释放。</text><rect x="918" y="210" width="210" height="53" rx="12" fill="#2e685b"/><text x="960" y="244" font-size="20" style="fill:#fff">检查连接</text><rect x="34" y="324" width="724" height="373" rx="18" fill="#fff"/><text x="59" y="370" class="title">最近一次对话</text><text x="59" y="405" class="small">交互状态：尚未收到设备事件</text><rect x="58" y="433" width="676" height="91" rx="12" fill="#f3f5f1"/><text x="79" y="464" class="small">你说</text><text x="79" y="499" class="body">连接后显示真实识别内容</text><rect x="58" y="543" width="676" height="91" rx="12" fill="#eaf2ed"/><text x="79" y="574" class="small">伙伴回复</text><text x="79" y="608" class="body">收到实际回复后显示</text><text x="59" y="672" class="small">来源与时间随内容显示；历史记录不会标为当前状态。</text><rect x="780" y="324" width="386" height="176" rx="18" fill="#fff"/><text x="804" y="369" class="title">你的伙伴</text><text x="804" y="411" class="body">人格　等待服务确认</text><text x="804" y="451" class="body">音色　等待服务确认</text><rect x="780" y="520" width="386" height="177" rx="18" fill="#fff"/><text x="804" y="565" class="title">设备音量</text><text x="804" y="602" class="small">未取得音量能力回执 · 控件禁用</text><rect x="806" y="630" width="214" height="7" rx="3" fill="#d8dfda"/><circle cx="812" cy="633" r="12" fill="#b8c3bd"/><rect x="1044" y="615" width="94" height="39" rx="9" fill="#e4e8e3"/><text x="1071" y="642" class="small">静音</text><rect x="34" y="720" width="1132" height="88" rx="15" fill="#e9eee8"/><text x="58" y="755" class="body">连接已有服务，不自动启动第二套模型</text><text x="58" y="787" class="small">关闭陪伴台只释放本窗口串口；Ollama、GPT-SoVITS 与 bridge 仍由原启动窗口管理。</text></svg>